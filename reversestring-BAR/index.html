<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse String</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            font-size: 20px;
        }

        p.instructions {
            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
            min-height: 24px;
            word-break: break-word;
        }

        .label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Reverse String</h1>

        <p class="instructions">
            Escribe texto en el campo inferior y verás automáticamente la cadena invertida en tiempo real.
        </p>

        <label class="label" for="inputText">Texto original:</label>
        <input id="inputText" type="text" placeholder="Escribe aquí..." />

        <span class="label">Texto invertido:</span>
        <div id="outputText" class="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
